name: msp430_lab
description: "Interactive 3D explainer for the TI MSP430F149 microcontroller."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / motion
  cupertino_icons: ^1.0.9
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  vector_graphics: ^1.2.2
  vibration: ^3.1.8

  # State management / DI / routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^18.0.0
  freezed_annotation: ^3.1.0

  # Local storage / localization
  shared_preferences: ^2.5.5
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # Desktop window (custom title bar, size limits, remembered bounds)
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  windows_single_instance: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  flutter_gen_runner: ^5.14.1
  vector_graphics_compiler: ^1.2.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - path: assets/svgIcons/
      transformers:
        - package: vector_graphics_compiler
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
