<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Keyboard shortcuts and gestures">
<style>
  .cap { animation: press 6s ease-in-out infinite; }
  @keyframes press { 0%,8%,100% { transform: translateY(0); fill: #232A55; } 4% { transform: translateY(4px); fill: #3B4A9A; } }
  .drag { animation: drag 3s ease-in-out infinite; }
  @keyframes drag { 0%,100% { transform: translateX(-28px); } 50% { transform: translateX(28px); } }
  .spin { animation: spin 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { 0%,100% { transform: rotate(-25deg); } 50% { transform: rotate(25deg); } }
  .wheel { animation: wheel 1.2s ease-in-out infinite; }
  @keyframes wheel { 0% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
  .pinch1 { animation: p1 2.4s ease-in-out infinite; } .pinch2 { animation: p2 2.4s ease-in-out infinite; }
  @keyframes p1 { 50% { transform: translate(-12px,-12px); } } @keyframes p2 { 50% { transform: translate(12px,12px); } }
  .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="cbg" cx="30%" cy="20%" r="95%">
    <stop offset="0" stop-color="#27336B"/><stop offset=".5" stop-color="#151B3A"/><stop offset="1" stop-color="#0B0E1C"/>
  </radialGradient>
  <pattern id="cbggrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8FA2FF" stroke-opacity=".07"/>
  </pattern>
</defs>
<rect width="1200" height="330" rx="24" fill="url(#cbg)"/>
<rect width="1200" height="330" rx="24" fill="url(#cbggrid)"/>
<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="20" font-weight="700" fill="#EEF1FF">Keyboard</text>
<text x="700" y="56" font-size="20" font-weight="700" fill="#EEF1FF">Mouse, touchpad, touch</text>
<g class="key" style="animation-delay:0.0s">
  <rect x="64" y="94" width="70" height="52" rx="10" fill="#070914"/>
  <rect class="cap" style="animation-delay:0.0s" x="64" y="90" width="70" height="52" rx="10" fill="#232A55" stroke="#4A5596"/>
  <text x="99.0" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#EEF1FF">←</text>
  <text x="99.0" y="172" text-anchor="middle" font-size="13" fill="#AEB8E8">next</text>
</g>
<g class="key" style="animation-delay:1.2s">
  <rect x="146" y="94" width="70" height="52" rx="10" fill="#070914"/>
  <rect class="cap" style="animation-delay:1.2s" x="146" y="90" width="70" height="52" rx="10" fill="#232A55" stroke="#4A5596"/>
  <text x="181.0" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#EEF1FF">→</text>
  <text x="181.0" y="172" text-anchor="middle" font-size="13" fill="#AEB8E8">previous</text>
</g>
<g class="key" style="animation-delay:2.4s">
  <rect x="228" y="94" width="120" height="52" rx="10" fill="#070914"/>
  <rect class="cap" style="animation-delay:2.4s" x="228" y="90" width="120" height="52" rx="10" fill="#232A55" stroke="#4A5596"/>
  <text x="288.0" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#EEF1FF">Space</text>
  <text x="288.0" y="172" text-anchor="middle" font-size="13" fill="#AEB8E8">play tour</text>
</g>
<g class="key" style="animation-delay:3.5999999999999996s">
  <rect x="360" y="94" width="70" height="52" rx="10" fill="#070914"/>
  <rect class="cap" style="animation-delay:3.5999999999999996s" x="360" y="90" width="70" height="52" rx="10" fill="#232A55" stroke="#4A5596"/>
  <text x="395.0" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#EEF1FF">Esc</text>
  <text x="395.0" y="172" text-anchor="middle" font-size="13" fill="#AEB8E8">back</text>
</g>
<g class="key" style="animation-delay:4.8s">
  <rect x="442" y="94" width="70" height="52" rx="10" fill="#070914"/>
  <rect class="cap" style="animation-delay:4.8s" x="442" y="90" width="70" height="52" rx="10" fill="#232A55" stroke="#4A5596"/>
  <text x="477.0" y="123" text-anchor="middle" font-size="18" font-weight="700" fill="#EEF1FF">R</text>
  <text x="477.0" y="172" text-anchor="middle" font-size="13" fill="#AEB8E8">reset camera</text>
</g>
<text x="64" y="250" font-size="13" fill="#6E7AB5">Arrows follow reading direction: the app is Arabic first (RTL).</text>
<text x="64" y="272" font-size="13" fill="#6E7AB5">PageUp / PageDown work too.</text>
<rect x="650" y="84" width="140" height="120" rx="16" fill="#1A2045" stroke="#3A4270"/>
<g transform="translate(720 144)"><g class="drag"><circle cx="0" cy="0" r="10" fill="#9DB0FF"/><circle cx="0" cy="0" r="18" fill="none" stroke="#9DB0FF" stroke-opacity=".4"/></g><path d="M-40 0h-14l5-5m-5 5l5 5M40 0h14l-5-5m5 5l-5 5" stroke="#AEB8E8" stroke-width="2" fill="none"/></g>
<text x="720" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#EEF1FF">Drag</text>
<text x="720" y="258" text-anchor="middle" font-size="13" fill="#AEB8E8">turn the chip</text>
<rect x="810" y="84" width="140" height="120" rx="16" fill="#1A2045" stroke="#3A4270"/>
<g transform="translate(880 144)"><rect x="-16" y="-26" width="32" height="52" rx="16" fill="none" stroke="#AEB8E8" stroke-width="2"/><rect class="wheel" x="-3" y="-16" width="6" height="12" rx="3" fill="#9DB0FF"/><g transform="translate(46 0)"><circle class="pinch1" cx="-6" cy="-6" r="6" fill="#2FA371"/><circle class="pinch2" cx="6" cy="6" r="6" fill="#2FA371"/></g></g>
<text x="880" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#EEF1FF">Wheel · pinch</text>
<text x="880" y="258" text-anchor="middle" font-size="13" fill="#AEB8E8">zoom in and out</text>
<rect x="980" y="84" width="140" height="120" rx="16" fill="#1A2045" stroke="#3A4270"/>
<g transform="translate(1050 144)"><circle class="ring" cx="0" cy="0" r="22" fill="none" stroke="#D9822B" stroke-width="2"/><circle cx="0" cy="0" r="8" fill="#D9822B"/></g>
<text x="1050" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#EEF1FF">Tap</text>
<text x="1050" y="258" text-anchor="middle" font-size="13" fill="#AEB8E8">a part: name + topic</text>
</g></svg>