<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How a topic is drawn: data, lab, 3D scene, screen">
<style>
  .flow { stroke-dasharray: 6 8; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .pkt { animation: hop 4s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes hop { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translateX(858px); opacity: 0; } }
  .box { animation: up .7s ease-out both; }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="pbg" cx="30%" cy="20%" r="95%">
    <stop offset="0" stop-color="#27336B"/><stop offset=".5" stop-color="#151B3A"/><stop offset="1" stop-color="#0B0E1C"/>
  </radialGradient>
  <pattern id="pbggrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8FA2FF" stroke-opacity=".07"/>
  </pattern>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#pbg)"/>
<rect width="1200" height="300" rx="24" fill="url(#pbggrid)"/>
<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#EEF1FF">How a topic is drawn</text>
<text x="600" y="78" text-anchor="middle" font-size="14" fill="#AEB8E8">Pure Dart and CustomPainter — no game engine, no network. Everything ships with the app.</text>
<g class="box" style="animation-delay:0.00s">
  <rect x="51" y="114" width="240" height="112" rx="16" fill="#1A2045" stroke="#4A7BD0" stroke-opacity=".6"/>
  <circle cx="77" cy="142" r="12" fill="#4A7BD0" fill-opacity=".2" stroke="#4A7BD0"/>
  <text x="77" y="146.5" text-anchor="middle" font-size="12" font-weight="700" fill="#4A7BD0">1</text>
  <text x="97" y="148" font-size="18" font-weight="700" fill="#EEF1FF">Topic data</text>
  <text x="69" y="180" font-size="12" fill="#4A7BD0" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">topics_local_datasource.dart</text>
  <text x="69" y="204" font-size="13" fill="#AEB8E8">theory · tour · book page</text>
</g>
<path class="flow" d="M295 170 H331" stroke="#AEB8E8" stroke-width="2"/><path d="M325 164 L333 170 L325 176" fill="none" stroke="#AEB8E8" stroke-width="2"/>
<g class="box" style="animation-delay:0.15s">
  <rect x="337" y="114" width="240" height="112" rx="16" fill="#1A2045" stroke="#2FA371" stroke-opacity=".6"/>
  <circle cx="363" cy="142" r="12" fill="#2FA371" fill-opacity=".2" stroke="#2FA371"/>
  <text x="363" y="146.5" text-anchor="middle" font-size="12" font-weight="700" fill="#2FA371">2</text>
  <text x="383" y="148" font-size="18" font-weight="700" fill="#EEF1FF">Lab</text>
  <text x="355" y="180" font-size="12" fill="#2FA371" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">presentation/labs/*_lab.dart</text>
  <text x="355" y="204" font-size="13" fill="#AEB8E8">builds the scene each tick</text>
</g>
<path class="flow" d="M581 170 H617" stroke="#AEB8E8" stroke-width="2"/><path d="M611 164 L619 170 L611 176" fill="none" stroke="#AEB8E8" stroke-width="2"/>
<g class="box" style="animation-delay:0.30s">
  <rect x="623" y="114" width="240" height="112" rx="16" fill="#1A2045" stroke="#D9822B" stroke-opacity=".6"/>
  <circle cx="649" cy="142" r="12" fill="#D9822B" fill-opacity=".2" stroke="#D9822B"/>
  <text x="649" y="146.5" text-anchor="middle" font-size="12" font-weight="700" fill="#D9822B">3</text>
  <text x="669" y="148" font-size="18" font-weight="700" fill="#EEF1FF">Scene3D</text>
  <text x="641" y="180" font-size="12" fill="#D9822B" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">core/scene3d/</text>
  <text x="641" y="204" font-size="13" fill="#AEB8E8">orbit camera · painter · hit test</text>
</g>
<path class="flow" d="M867 170 H903" stroke="#AEB8E8" stroke-width="2"/><path d="M897 164 L905 170 L897 176" fill="none" stroke="#AEB8E8" stroke-width="2"/>
<g class="box" style="animation-delay:0.45s">
  <rect x="909" y="114" width="240" height="112" rx="16" fill="#1A2045" stroke="#9DB0FF" stroke-opacity=".6"/>
  <circle cx="935" cy="142" r="12" fill="#9DB0FF" fill-opacity=".2" stroke="#9DB0FF"/>
  <text x="935" y="146.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9DB0FF">4</text>
  <text x="955" y="148" font-size="18" font-weight="700" fill="#EEF1FF">Topic screen</text>
  <text x="927" y="180" font-size="12" fill="#9DB0FF" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">topic_screen.dart</text>
  <text x="927" y="204" font-size="13" fill="#AEB8E8">tour bar · try-it controls</text>
</g>
<circle class="pkt" cx="287" cy="170" r="5" fill="#fff"/>
<text x="600" y="270" text-anchor="middle" font-size="13" fill="#6E7AB5">A Ticker advances the lab and the camera every frame; the painter projects each shape and keeps a hit list for taps.</text>
</g></svg>